name: Release

on:
  push:
    branches:
      - main

jobs:
  create-release:
    name: Build and Create Tagged Release
    runs-on: ubuntu-latest
    steps:
      - name: Install archive tools
        run: sudo apt install zip

      - name: Checkout source code
        uses: actions/checkout@v2
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup node
        uses: actions/setup-node@v3
        with:
          node-version: 22.x
          cache: 'pnpm'
          cache-dependency-path: 'web/pnpm-lock.yaml'

      - name: Set env
        run: echo "RELEASE_VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV

      - name: Install dependencies
        run: pnpm install
        working-directory: web

      - name: Install package dependencies
        run: pnpm install
        working-directory: web

      - name: Run build
        run: pnpm build
        working-directory: web
        env:
          CI: false

      - name: Bump manifest version
        run: node .github/actions/bump-manifest-version.js
        # The script now writes NEW_VERSION to GITHUB_ENV

      - name: Push manifest change
        uses: EndBug/add-and-commit@v8
        with:
          add: fxmanifest.lua
          push: true
          author_name: Manifest Bumper
          author_email: 41898282+github-actions[bot]@users.noreply.github.com
          message: 'chore: bump manifest version to ${{ env.NEW_VERSION }}'

      - name: Update branch
        working-directory: ./
        run: git push origin HEAD:main


      # ── Changelog, from dirk_publicInfo ──
      # The entry is authored ONCE, as JSON, via the dirk-changelog MCP. This
      # renders it into the CHANGELOG.md that ships in the zip, so the file a
      # customer reads and the entry the panel fetches are the same text.
      #
      # It is also a GATE: no entry for the version being built and the release
      # STOPS, rather than quietly shipping the previous version's notes.
      - name: Changelog from publicInfo
        run: |
          BASE=https://raw.githubusercontent.com/DirkScripts-FiveM/dirk_publicInfo/main
          curl -fsSL "$BASE/render.mjs" -o /tmp/render.mjs
          curl -fsSL "$BASE/changelogs/dirk_lib.json" -o /tmp/changelog.json
          node /tmp/render.mjs /tmp/changelog.json "${{ env.NEW_VERSION }}" > CHANGELOG.md
          echo "CHANGELOG.md rendered for ${{ env.NEW_VERSION }}"

      - name: Bundle files
        run: |
          mkdir -p ./temp/dirk_lib
          mkdir -p ./temp/dirk_lib/web/
          cp ./fxmanifest.lua ./init.lua ./schema.json ./README.md ./CHANGELOG.md ./LICENSE ./temp/dirk_lib/
          cp -r ./src ./temp/dirk_lib
          cp -r ./bridge ./temp/dirk_lib
          cp -r ./locales ./temp/dirk_lib
          cp -r ./modules ./temp/dirk_lib
          cp -r ./web/build ./temp/dirk_lib/web/
          cd ./temp && zip -r ../dirk_lib.zip ./dirk_lib

      - name: Create Release
        uses: marvinpinto/action-automatic-releases@v1.2.1
        id: auto_release
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          title: "Release ${{ env.NEW_VERSION }}"
          prerelease: false
          files: dirk_lib.zip
          automatic_release_tag: 'latest_production'
        env:
          CI: false
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}